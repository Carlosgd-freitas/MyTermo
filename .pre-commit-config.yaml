repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: Ruff Lint
        entry: ruff check --fix
        language: system
        types: [python]
        
      - id: ruff-format
        name: Ruff Format
        entry: ruff format
        language: system
        types: [python]
        
      - id: prettier
        name: Prettier
        entry: npx prettier --write
        language: system
        types_or: [javascript, css, html]