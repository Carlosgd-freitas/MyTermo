<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTermo</title>
    <!-- Base styles only -->
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div id="game-container">
        <header class="header">
            <div class="header-left">
                <button id="theme-btn" class="icon-btn" onclick="openThemeModal()">Theme</button>
            </div>
            <div class="header-title-container">
                <h1 id="game-title">MyTermo</h1>
                <div id="target-badge" class="target-badge"></div>
            </div>
            <div class="header-right">
                <div class="lang-container">
                    <label for="lang-select" class="lang-label" id="lang-label">Language</label>
                    <select id="lang-select" class="lang-dropdown" onchange="changeLanguage(this.value)">
                        <option value="en">🇺🇸 English</option>
                        <option value="pt">🇧🇷 Português</option>
                    </select>
                </div>
            </div>
        </header>

        <div id="message"></div>
        <div id="grid"></div>

        <div class="actions">
            <button id="hint-btn" onclick="useHint()">Hint</button>
            <button id="giveup-btn" onclick="giveUp()">Give Up</button>
        </div>

        <div id="keyboard"></div>
    </div>

    <!-- Theme Modal -->
    <div id="theme-modal" class="modal-overlay">
        <div class="modal-content theme-modal-content">
            <button class="modal-close-x" onclick="closeThemeModal()">&times;</button>
            <h2 id="theme-modal-title">Select Theme</h2>
            <div id="theme-grid" class="theme-grid"></div>
        </div>
    </div>

    <!-- Endgame Modal -->
    <div id="endgame-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title"></h2>
            <p id="modal-message"></p>
            <div id="modal-word-container" style="display: none;">
                <span id="modal-word-label"></span>
                <strong id="modal-word"></strong>
            </div>
            <button class="modal-close-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
