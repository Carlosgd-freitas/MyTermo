<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <link rel="stylesheet" href="/css/styles.css">
    <title>Termo</title>
</head>
<body>

    <div class="lang-container">
        <button id="lang-en" class="lang-btn" onclick="changeLanguage('en')">
            <svg class="flag-icon" viewBox="0 0 60 30">
                <clipPath id="s"><path d="M0,0 v30 h60 v-30 z"/></clipPath>
                <clipPath id="t"><path d="M30,15 h30 v15 z M30,15 h-30 v-15 z M30,15 h-30 v15 z M30,15 h30 v-15 z"/></clipPath>
                <g clip-path="url(#s)">
                    <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
                    <path d="M0,0 L60,30 M60,0 L0,30" stroke="#cf142b" stroke-width="2" clip-path="url(#t)"/>
                    <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
                    <path d="M30,0 v30 M0,15 h60" stroke="#cf142b" stroke-width="6"/>
                </g>
            </svg> EN
        </button>
        <button id="lang-pt" class="lang-btn" onclick="changeLanguage('pt')">
            <svg class="flag-icon" viewBox="0 0 700 490">
                <rect width="700" height="490" fill="#009b3a"/>
                <path d="M350,42 L658,245 L350,448 L42,245 Z" fill="#fedf00"/>
                <circle cx="350" cy="245" r="126" fill="#002776"/>
            </svg> PT
        </button>
    </div>

    <h1 id="game-title">TERMO</h1>

    <div id="grid"></div>
    <div id="message"></div>
    <div id="keyboard"></div>

    <button id="giveup-btn" class="give-up-btn" onclick="giveUp()">Give Up</button>

    <script src="/js/app.js"></script>
</body>
</html>
